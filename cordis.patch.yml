# dsh-workbuddy-fetch bundle patch.
#
# 1) 挂载本插件自身（宿主侧一行 row，无 UI 客户端注入）。
- insert:
    - id: web-workbuddy-fetch
      name: dsh-workbuddy-fetch

# 2) 把 web 接缝的**搜索**与**抓取**两个 provider 都指到 WorkBuddy。
#
#    注意 applyEntryPatches 的语义是「按 id 整行替换 config」，不是合并：
#    dsh-base 的 web 行只有 searchProvider / fetchProvider 两个键，
#    这里必须**两个都写**，否则漏掉的那个会被抹成 undefined。
#
#    - searchProvider: 本插件在 apply() 里**委托** dsh-workbuddy-websearch 的
#      apply() 来注册 workbuddy-agentic（不复制它的实现）。上游若也被挂载、
#      已经注册过，本插件会静默认领，不会重复注册。
#    - fetchProvider: 本插件自己的 workbuddy-fetch。
#
#    若用户卸载本插件，bundle patch 随包消失，web 行自动回到上一层
#    （dsh-base 的 searchProvider: deepseek-official / fetchProvider: http）。
- id: web
  name: '@deepseek-ai/dsh-web'
  config:
    searchProvider: workbuddy-agentic
    fetchProvider: workbuddy-fetch
